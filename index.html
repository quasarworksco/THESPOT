<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SPOT - Sistema Integral 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --dark-gray: #1a1a1a;
            --medium-gray: #4a4a4a;
            --soft-gray: #f0f0f0;
            --border-gray: #d1d1d1;
            --white: #ffffff;
            --status-procesado: #6c757d;
            --status-enviado: #f9a825;
            --status-entregado: #2e7d32;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background-color: #fafafa; 
            color: var(--dark-gray); 
            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--dark-gray);
            padding: 30px 0;
            background: var(--white);
        }

        header h1 { font-size: 3rem; margin: 0; letter-spacing: -2px; text-transform: uppercase; }
        header p { font-weight: 700; font-size: 0.75rem; letter-spacing: 3px; color: var(--medium-gray); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-box { 
            background: var(--dark-gray); 
            color: var(--white); 
            padding: 20px 10px; 
            text-align: center;
        }

        .stat-box small { font-size: 0.6rem; text-transform: uppercase; display: block; opacity: 0.7; }
        .stat-box div { font-size: 1.3rem; font-weight: 800; }

        .card {
            background: var(--white);
            padding: 25px;
            border: 1px solid var(--dark-gray);
            box-shadow: 6px 6px 0px var(--dark-gray);
        }

        h2 { 
            text-transform: uppercase; font-size: 0.85rem; border-left: 4px solid var(--medium-gray); 
            padding-left: 12px; margin-bottom: 25px; letter-spacing: 1px;
        }

        .form-vertical { display: flex; flex-direction: column; gap: 12px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; color: var(--medium-gray); }
        
        input, select { 
            padding: 12px; border: 1px solid var(--border-gray); font-weight: 600; 
            font-size: 0.9rem; width: 100%;
        }

        button.btn-main { 
            background: var(--dark-gray); color: var(--white); border: none; padding: 16px; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px;
        }

        /* TABLA COMPACTA */
        .table-scroll { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 650px; }
        thead th { background: var(--dark-gray); color: var(--white); padding: 8px; text-align: left; }
        td { padding: 6px 8px; border-bottom: 1px solid var(--soft-gray); vertical-align: middle; }

        .btn-status {
            border: none;
            padding: 5px 8px;
            color: white;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            width: 85px;
            transition: var(--transition);
        }

        .status-procesado { background-color: var(--status-procesado); }
        .status-enviado { background-color: var(--status-enviado); }
        .status-entregado { background-color: var(--status-entregado); }
        .btn-status:disabled { opacity: 0.5; cursor: not-allowed; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .invoice-box { width: 90%; max-width: 400px; padding: 30px; border: 1px solid var(--dark-gray); background: white; }

        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>THE SPOT</h1>
        <p>GESTIÓN DE VENTAS • DGP GROUP USA</p>
    </header>

    <div class="stats-grid">
        <div class="stat-box"><small>Total Ingresos</small><div id="dash-total">$0</div></div>
        <div class="stat-box"><small>Ventas</small><div id="dash-count">0</div></div>
        <div class="stat-box"><small>Promedio</small><div id="dash-avg">$0</div></div>
    </div>

    <div class="card">
        <h2>Nueva Transacción</h2>
        <form id="registroForm" class="form-vertical">
            <div class="field"><label>Cliente</label><input type="text" name="nombre" required></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="field"><label>Cédula</label><input type="text" name="cedula" required></div>
                <div class="field"><label>Teléfono</label><input type="text" name="telefono" required></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="field"><label>Estado</label><select name="estado" id="selectEstado" required></select></div>
                <div class="field"><label>Agencia</label><input type="text" name="agencia" placeholder="AG-01" required></div>
            </div>
            <div class="field"><label>Producto</label><input type="text" name="producto" required></div>
            <div class="field"><label>Monto ($)</label><input type="number" step="0.01" name="monto" required></div>
            <button type="submit" id="btnGuardar" class="btn-main">Procesar Venta</button>
        </form>
    </div>

    <div class="card">
        <h2>Historial y Logística</h2>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Monto</th>
                        <th>Logística</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modalFactura" class="modal">
    <div class="invoice-box" id="invoice-printable">
        <h2 style="border:none; padding:0; font-size: 1.8rem; margin-bottom: 5px;">THE SPOT</h2>
        <div id="invoice-content" style="font-size: 0.8rem; line-height: 1.6;"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px;" class="no-print">
            <button onclick="window.print()" style="flex:1; padding:10px; background:#000; color:#fff; cursor:pointer;">IMPRIMIR</button>
            <button onclick="cerrarFactura()" style="flex:1; padding:10px; background:#eee; border:none; cursor:pointer;">CERRAR</button>
        </div>
    </div>
</div>

<script>
    // REEMPLAZA ESTE URL CON EL DE TU NUEVA IMPLEMENTACIÓN
    const scriptURL = 'TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI';
    const estadosVzla = ["Amazonas","Anzoátegui","Apure","Aragua","Barinas","Bolívar","Carabobo","Cojedes","Delta Amacuro","Distrito Capital","Falcón","Guárico","Lara","Mérida","Miranda","Monagas","Nueva Esparta","Portuguesa","Sucre","Táchira","Trujillo","Vargas","Yaracuy","Zulia"];

    const selectE = document.getElementById('selectEstado');
    estadosVzla.forEach(e => selectE.innerHTML += `<option value="${e}">${e}</option>`);

    async function cargarTodo() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            let total = 0;
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';

            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                total += parseFloat(v.monto || 0);
                const logStat = v.logistica || 'procesado';

                tbody.innerHTML += `<tr>
                    <td>${new Date(v.fecha).toLocaleDateString()}</td>
                    <td><strong>${v.nombre}</strong></td>
                    <td><strong>$${parseFloat(v.monto).toFixed(2)}</strong></td>
                    <td>
                        <button class="btn-status status-${logStat}" onclick="toggleStatus('${v.rowId}', this)">
                            ${logStat}
                        </button>
                    </td>
                    <td><button style="font-size:0.6rem; cursor:pointer;" onclick='verFactura(${JSON.stringify(v)})'>DOC</button></td>
                </tr>`;
            });

            document.getElementById('dash-total').innerText = `$${total.toLocaleString()}`;
            document.getElementById('dash-count').innerText = data.length;
            document.getElementById('dash-avg').innerText = `$${(total / (data.length || 1)).toFixed(2)}`;
        } catch (e) { console.error("Error cargando datos:", e); }
    }

    async function toggleStatus(rowId, btn) {
        const states = ['procesado', 'enviado', 'entregado'];
        let current = btn.innerText.trim().toLowerCase();
        let nextState = states[(states.indexOf(current) + 1) % states.length];

        btn.disabled = true;
        btn.innerText = "...";

        const formData = new FormData();
        formData.append('rowId', rowId);
        formData.append('logistica', nextState);

        try {
            await fetch(scriptURL, { method: 'POST', body: formData });
            btn.innerText = nextState;
            btn.className = `btn-status status-${nextState}`;
        } catch (e) {
            alert("Error al actualizar");
            btn.innerText = current;
        } finally {
            btn.disabled = false;
        }
    }

    function verFactura(d) {
        document.getElementById('invoice-content').innerHTML = `
            <hr>
            <p><b>FECHA:</b> ${new Date(d.fecha).toLocaleString()}</p>
            <p><b>CLIENTE:</b> ${d.nombre}</p>
            <p><b>CÉDULA:</b> ${d.cedula}</p>
            <p><b>PRODUCTO:</b> ${d.producto}</p>
            <p><b>UBICACIÓN:</b> ${d.estado} - ${d.agencia}</p>
            <h3 style="text-align:right; font-size: 1.5rem; border-top: 1px solid #000; padding-top: 10px;">
                TOTAL: $${parseFloat(d.monto).toFixed(2)}
            </h3>
        `;
        document.getElementById('modalFactura').style.display = 'flex';
    }

    function cerrarFactura() { document.getElementById('modalFactura').style.display = 'none'; }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "PROCESANDO...";
        const formData = new FormData(e.target);
        try {
            await fetch(scriptURL, { method: 'POST', body: formData });
            e.target.reset();
            cargarTodo();
        } catch (error) { alert("Error al guardar"); }
        btn.innerText = "PROCESAR VENTA";
    });

    window.onload = cargarTodo;
</script>
</body>
</html>
