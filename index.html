<script>
    const scriptURL = 'TU_NUEVO_URL_AQUI'; // <--- IMPORTANTE: Pon el nuevo URL aquí

    // Cargar datos en la tabla
    async function cargarTodo() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';

            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                const logStat = v.logistica || 'procesado';
                tbody.innerHTML += `<tr>
                    <td>${new Date(v.fecha).toLocaleDateString()}</td>
                    <td><strong>${v.nombre}</strong></td>
                    <td><strong>$${parseFloat(v.monto).toFixed(2)}</strong></td>
                    <td>
                        <button class="btn-status status-${logStat}" onclick="toggleStatus('${v.rowId}', this)">
                            ${logStat}
                        </button>
                    </td>
                    <td><button style="font-size:0.6rem;" onclick='verFactura(${JSON.stringify(v)})'>DOC</button></td>
                </tr>`;
            });
            // Actualizar dashboard aquí...
        } catch (e) { console.error("Error:", e); }
    }

    // Función para el botón de Logística (Columna I)
    async function toggleStatus(rowId, btn) {
        const states = ['procesado', 'enviado', 'entregado'];
        let current = btn.innerText.trim().toLowerCase();
        let nextState = states[(states.indexOf(current) + 1) % states.length];

        btn.disabled = true;
        btn.innerText = "...";

        // Enviamos los datos como parámetros de URL para evitar errores de conexión
        const params = new URLSearchParams();
        params.append('rowId', rowId);
        params.append('logistica', nextState);

        try {
            await fetch(scriptURL, {
                method: 'POST',
                body: params,
                mode: 'no-cors' // Esto evita errores de bloqueo de navegador
            });
            
            // Actualización visual
            btn.innerText = nextState;
            btn.className = `btn-status status-${nextState}`;
        } catch (e) {
            alert("Error al guardar");
            btn.innerText = current;
        } finally {
            btn.disabled = false;
        }
    }

    // Registro de nueva venta
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "PROCESANDO...";
        
        const formData = new URLSearchParams(new FormData(e.target));

        try {
            await fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' });
            e.target.reset();
            cargarTodo();
        } catch (error) { alert("Error al registrar"); }
        btn.innerText = "Procesar Venta";
    });

    window.onload = cargarTodo;
</script>
