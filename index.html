<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SPOT - Sistema Logístico</title>
    <style>
        :root {
            --dark: #111;
            --white: #fff;
            --btn-p: #6c757d; /* Procesado */
            --btn-e: #f1c40f; /* Enviado */
            --btn-d: #27ae60; /* Entregado */
        }
        body { font-family: 'Arial', sans-serif; background: #f0f0f0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: var(--white); padding: 25px; border: 2px solid var(--dark); box-shadow: 8px 8px 0px var(--dark); }
        header { text-align: center; border-bottom: 3px solid var(--dark); margin-bottom: 20px; }
        
        /* Formulario Estilo THE SPOT */
        .form-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid var(--dark); }
        .full { grid-column: span 2; }
        button#btnGuardar { background: var(--dark); color: var(--white); padding: 15px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* Tabla y Botones */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.8rem; }
        th { background: var(--dark); color: var(--white); padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ccc; }
        
        .btn-status { 
            border: none; padding: 5px 10px; color: white; font-weight: bold; 
            text-transform: uppercase; font-size: 0.6rem; cursor: pointer; width: 90px;
        }
        .status-procesado { background-color: var(--btn-p); }
        .status-enviado { background-color: var(--btn-e); color: #000; }
        .status-entregado { background-color: var(--btn-d); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>THE SPOT</h1></header>

    <form id="registroForm" class="form-container">
        <div class="field"><label>Nombre</label><input type="text" name="nombre" required></div>
        <div class="field"><label>Cédula</label><input type="text" name="cedula" required></div>
        <div class="field"><label>Teléfono</label><input type="text" name="telefono" required></div>
        <div class="field">
            <label>Estado</label>
            <select name="estado" required>
                <option value="Zulia">Zulia</option>
                <option value="Caracas">Caracas</option>
                <option value="Carabobo">Carabobo</option>
                </select>
        </div>
        <div class="field"><label>Agencia</label><input type="text" name="agencia" required></div>
        <div class="field"><label>Producto</label><input type="text" name="producto" required></div>
        <div class="field full"><label>Monto $</label><input type="number" step="0.01" name="monto" required></div>
        <button type="submit" id="btnGuardar" class="full">Registrar Venta</button>
    </form>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Monto</th>
                    <th>Logística</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQWjggPSP6ZOkkFTvljn3QmWwKj4wbQ-iigliSxIyDFUoh3L9QPDHx56FNxHNbVFn9/exec';

    // 1. CARGAR DATOS
    async function cargar() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';

            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                const st = (v.logistica || 'procesado').toLowerCase();
                tbody.innerHTML += `
                    <tr>
                        <td>${v.nombre}</td>
                        <td>$${v.monto}</td>
                        <td>
                            <button class="btn-status status-${st}" onclick="cambiar('${v.rowId}', this)">
                                ${st}
                            </button>
                        </td>
                    </tr>`;
            });
        } catch (e) { console.error("Error cargando:", e); }
    }

    // 2. ACTUALIZAR LOGÍSTICA (BOTÓN)
    async function cambiar(id, btn) {
        const estados = ['procesado', 'enviado', 'entregado'];
        let actual = btn.innerText.trim().toLowerCase();
        let proximo = estados[(estados.indexOf(actual) + 1) % estados.length];

        btn.disabled = true;
        btn.innerText = "...";

        // Usamos una URL con parámetros para asegurar que Google lo reciba siempre
        const updateURL = `${scriptURL}?rowId=${id}&logistica=${proximo}`;

        try {
            await fetch(updateURL, { method: 'POST' });
            btn.innerText = proximo;
            btn.className = `btn-status status-${proximo}`;
        } catch (e) {
            alert("Error de conexión");
            btn.innerText = actual;
        } finally {
            btn.disabled = false;
        }
    }

    // 3. NUEVO REGISTRO
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "REGISTRANDO...";
        
        const data = new FormData(e.target);
        const params = new URLSearchParams(data);

        try {
            await fetch(scriptURL, { method: 'POST', body: params });
            e.target.reset();
            cargar();
        } catch (error) { alert("Error al guardar"); }
        btn.innerText = "Registrar Venta";
    });

    window.onload = cargar;
</script>
</body>
</html>
