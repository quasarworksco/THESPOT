<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SPOT - Sistema Integral 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --dark-gray: #1a1a1a;
            --medium-gray: #4a4a4a;
            --soft-gray: #f0f0f0;
            --border-gray: #d1d1d1;
            --white: #ffffff;
            --status-procesado: #6c757d;
            --status-enviado: #f9a825;
            --status-entregado: #2e7d32;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background-color: #fafafa; 
            color: var(--dark-gray); 
            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { 
            width: 100%; 
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--dark-gray);
            padding: 30px 0;
            background: var(--white);
        }

        header h1 { font-size: 3rem; margin: 0; letter-spacing: -2px; text-transform: uppercase; }
        header p { font-weight: 700; font-size: 0.75rem; letter-spacing: 3px; color: var(--medium-gray); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-box { 
            background: var(--dark-gray); 
            color: var(--white); 
            padding: 20px 10px; 
            text-align: center;
            transition: var(--transition);
        }

        .stat-box small { font-size: 0.6rem; text-transform: uppercase; display: block; margin-bottom: 5px; opacity: 0.7; }
        .stat-box div { font-size: 1.3rem; font-weight: 800; }

        .card {
            background: var(--white);
            padding: 25px;
            border: 1px solid var(--dark-gray);
            box-shadow: 6px 6px 0px var(--dark-gray);
        }

        h2 { 
            text-transform: uppercase; font-size: 0.85rem; border-left: 4px solid var(--medium-gray); 
            padding-left: 12px; margin-top: 0; margin-bottom: 25px; letter-spacing: 1px;
        }

        .form-vertical { display: flex; flex-direction: column; gap: 15px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; color: var(--medium-gray); }
        
        input, select { 
            padding: 14px; border: 1px solid var(--border-gray); font-weight: 600; 
            font-size: 0.95rem; width: 100%; background: #fdfdfd;
        }

        button.btn-main { 
            background: var(--dark-gray); color: var(--white); border: none; padding: 18px; 
            font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 1px;
        }

        /* TABLA AJUSTADA */
        .table-scroll { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 600px; }
        thead th { background: var(--dark-gray); color: var(--white); padding: 10px; text-align: left; }
        td { padding: 8px 10px; border-bottom: 1px solid var(--soft-gray); vertical-align: middle; }

        /* BOTONES DE ESTATUS LOGÍSTICO */
        .btn-status {
            border: none;
            padding: 6px 10px;
            color: white;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            width: 90px;
            transition: var(--transition);
        }

        .status-procesado { background-color: var(--status-procesado); }
        .status-enviado { background-color: var(--status-enviado); }
        .status-entregado { background-color: var(--status-entregado); }

        .btn-ver {
            background: none;
            border: 1px solid var(--dark-gray);
            font-size: 0.6rem;
            padding: 5px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .invoice-box { 
            width: 90%; max-width: 420px; padding: 40px; border: 1px solid var(--dark-gray); 
            background: var(--white); box-shadow: 15px 15px 0px rgba(0,0,0,0.1);
        }

        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>THE SPOT</h1>
        <p>GESTIÓN DE VENTAS • DGP GROUP USA</p>
    </header>

    <div class="stats-grid">
        <div class="stat-box"><small>Ingresos Totales</small><div id="dash-total">$0</div></div>
        <div class="stat-box"><small>Registros</small><div id="dash-count">0</div></div>
        <div class="stat-box"><small>Ticket Promedio</small><div id="dash-avg">$0</div></div>
    </div>

    <div class="card">
        <h2>Nueva Transacción</h2>
        <form id="registroForm" class="form-vertical">
            <div class="field"><label>Nombre Completo</label><input type="text" name="nombre" required></div>
            <div class="field"><label>Cédula / ID</label><input type="text" name="cedula" required></div>
            <div class="field"><label>Teléfono</label><input type="text" name="telefono" required></div>
            <div class="field"><label>Ubicación (Estado)</label><select name="estado" id="selectEstado" required></select></div>
            <div class="field"><label>Código de Agencia</label><input type="text" name="agencia" placeholder="AG-01" required></div>
            <div class="field"><label>Nombre del Producto</label><input type="text" name="producto" required></div>
            <div class="field"><label>Monto Total ($)</label><input type="number" step="0.01" name="monto" required></div>
            <div class="field">
                <label>Estatus de Pago</label>
                <select name="estadoVenta">
                    <option value="Completada">Completada</option>
                    <option value="Pendiente">Pendiente</option>
                </select>
            </div>
            <button type="submit" id="btnGuardar" class="btn-main">Procesar y Generar Factura</button>
        </form>
    </div>

    <div class="card">
        <h2>Historial General de Pedidos</h2>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Pago</th>
                        <th>Monto</th>
                        <th>Logística (Clic para cambiar)</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>
    </div>

    <footer class="signature">
        <p>POWERED BY DGP GROUP USA</p>
    </footer>
</div>

<div id="modalFactura" class="modal">
    <div class="invoice-box" id="invoice-printable">
        <h2 style="border:none; padding:0; font-size: 2.2rem; margin-bottom: 5px;">THE SPOT</h2>
        <p style="font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 20px; color: var(--medium-gray);">COMPROBANTE OFICIAL</p>
        <div id="invoice-content"></div>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 30px;" class="no-print">
            <button onclick="window.print()" style="padding:12px; background:var(--dark-gray); color:white; font-weight:bold; cursor:pointer;">IMPRIMIR PDF</button>
            <button onclick="cerrarFactura()" style="padding:10px; background:var(--soft-gray); border:none; cursor:pointer;">CERRAR</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQWjggPSP6ZOkkFTvljn3QmWwKj4wbQ-iigliSxIyDFUoh3L9QPDHx56FNxHNbVFn9/exec';
    const estadosVzla = ["Amazonas","Anzoátegui","Apure","Aragua","Barinas","Bolívar","Carabobo","Cojedes","Delta Amacuro","Distrito Capital","Falcón","Guárico","Lara","Mérida","Miranda","Monagas","Nueva Esparta","Portuguesa","Sucre","Táchira","Trujillo","Vargas","Yaracuy","Zulia"];
    
    // Objeto para persistir estados logísticos localmente en esta sesión
    const logisticStatusMap = {};

    const selectE = document.getElementById('selectEstado');
    estadosVzla.forEach(e => selectE.innerHTML += `<option value="${e}">${e}</option>`);

    async function cargarTodo() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            
            const total = data.reduce((sum, v) => sum + parseFloat(v.monto || 0), 0);
            document.getElementById('dash-total').innerText = `$${total.toLocaleString()}`;
            document.getElementById('dash-count').innerText = data.length;
            document.getElementById('dash-avg').innerText = `$${(total / (data.length || 1)).toFixed(2)}`;

            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach((v, index) => {
                const idUnico = v.id || index; // Usar ID o índice
                if(!logisticStatusMap[idUnico]) logisticStatusMap[idUnico] = 'procesado';

                const estPago = v.estadoVenta || 'Completada';
                const currentLogistics = logisticStatusMap[idUnico];

                tbody.innerHTML += `<tr>
                    <td>${new Date(v.fecha).toLocaleDateString()}</td>
                    <td><strong>${v.nombre}</strong></td>
                    <td><span style="font-size:0.6rem; padding:2px 5px; border:1px solid #ddd;">${estPago}</span></td>
                    <td><strong>$${parseFloat(v.monto).toFixed(2)}</strong></td>
                    <td>
                        <button id="log-${idUnico}" class="btn-status status-${currentLogistics}" onclick="toggleStatus('${idUnico}')">
                            ${currentLogistics}
                        </button>
                    </td>
                    <td><button class="btn-ver" onclick='verFactura(${JSON.stringify(v)})'>DOC</button></td>
                </tr>`;
            });
        } catch (e) { console.error(e); }
    }

    function toggleStatus(id) {
        const btn = document.getElementById(`log-${id}`);
        const states = ['procesado', 'enviado', 'entregado'];
        let current = logisticStatusMap[id];
        let nextIndex = (states.indexOf(current) + 1) % states.length;
        let nextState = states[nextIndex];

        // Actualizar mapa y botón
        logisticStatusMap[id] = nextState;
        btn.innerText = nextState;
        btn.className = `btn-status status-${nextState}`;
    }

    function verFactura(d) {
        const content = `
            <div class="inv-detail"><span class="inv-label">Fecha:</span><span>${new Date(d.fecha).toLocaleString()}</span></div>
            <div class="inv-detail"><span class="inv-label">Cliente:</span><span>${d.nombre}</span></div>
            <div class="inv-detail"><span class="inv-label">Cédula:</span><span>${d.cedula || 'N/A'}</span></div>
            <div class="inv-detail"><span class="inv-label">Producto:</span><span>${d.producto}</span></div>
            <div style="font-size: 2rem; font-weight: 900; text-align: right; border-top: 2px solid var(--dark-gray); padding-top: 15px; margin-top: 20px;">
                $${parseFloat(d.monto).toFixed(2)}
            </div>
        `;
        document.getElementById('invoice-content').innerHTML = content;
        document.getElementById('modalFactura').style.display = 'flex';
    }

    function cerrarFactura() { document.getElementById('modalFactura').style.display = 'none'; }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "PROCESANDO...";
        const formData = new FormData(e.target);
        await fetch(scriptURL, { method: 'POST', body: formData });
        btn.innerText = "PROCESAR Y GENERAR FACTURA";
        e.target.reset();
        cargarTodo();
    });

    window.onload = cargarTodo;
</script>
</body>
</html>
