<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SPOT - Control Logístico</title>
    <style>
        :root {
            --dark: #1a1a1a;
            --light: #ffffff;
            --gray: #f4f4f4;
            --border: #dddddd;
            /* Colores de Estatus */
            --color-procesado: #6e6e6e; /* Gris */
            --color-enviado: #f39c12;    /* Naranja/Amarillo */
            --color-entregado: #27ae60;  /* Verde */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--light);
            padding: 30px;
            border: 2px solid var(--dark);
            box-shadow: 10px 10px 0px var(--dark);
        }

        header {
            text-align: center;
            border-bottom: 4px solid var(--dark);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        /* Dashboard de Resumen */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--dark);
            color: var(--light);
            padding: 15px;
            text-align: center;
        }

        .stat-card small { font-size: 0.7rem; text-transform: uppercase; opacity: 0.7; }
        .stat-card div { font-size: 1.5rem; font-weight: bold; }

        /* Formulario */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .field { display: flex; flex-direction: column; }
        label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid var(--dark); font-size: 1rem; }

        .btn-submit {
            grid-column: span 2;
            background: var(--dark);
            color: var(--light);
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-submit:hover { background: #333; }

        /* Tabla */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th { background: var(--dark); color: var(--light); padding: 12px; text-align: left; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }

        /* Botones de Estatus dinámicos */
        .btn-status {
            border: none;
            padding: 6px 12px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.65rem;
            cursor: pointer;
            width: 100px;
            border-radius: 3px;
            transition: transform 0.1s;
        }

        .btn-status:active { transform: scale(0.95); }
        .btn-status:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-procesado { background-color: var(--color-procesado); }
        .status-enviado { background-color: var(--color-enviado); }
        .status-entregado { background-color: var(--color-entregado); }

        .btn-doc {
            background: none;
            border: 1px solid var(--dark);
            cursor: pointer;
            font-weight: bold;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>THE SPOT</h1>
        <p>CONTROL DE VENTAS Y LOGÍSTICA 2026</p>
    </header>

    <div class="stats">
        <div class="stat-card"><small>Ingresos Totales</small><div id="total-monto">$0</div></div>
        <div class="stat-card"><small>Pedidos</small><div id="total-pedidos">0</div></div>
    </div>

    <div class="card">
        <h2 style="font-size: 1rem; text-transform: uppercase;">Nuevo Registro</h2>
        <form id="registroForm" class="form-grid">
            <div class="field"><label>Nombre Cliente</label><input type="text" name="nombre" required></div>
            <div class="field"><label>Cédula</label><input type="text" name="cedula" required></div>
            <div class="field"><label>Teléfono</label><input type="text" name="telefono" required></div>
            <div class="field"><label>Estado</label>
                <select name="estado" id="selectEstado" required></select>
            </div>
            <div class="field"><label>Cod. Agencia</label><input type="text" name="agencia" required></div>
            <div class="field"><label>Producto</label><input type="text" name="producto" required></div>
            <div class="field" style="grid-column: span 2;"><label>Monto Total ($)</label><input type="number" step="0.01" name="monto" required></div>
            <button type="submit" id="btnGuardar" class="btn-submit">Registrar Venta</button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Producto</th>
                    <th>Monto</th>
                    <th>Logística</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                </tbody>
        </table>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQWjggPSP6ZOkkFTvljn3QmWwKj4wbQ-iigliSxIyDFUoh3L9QPDHx56FNxHNbVFn9/exec';
    const estadosVzla = ["Amazonas","Anzoátegui","Apure","Aragua","Barinas","Bolívar","Carabobo","Cojedes","Delta Amacuro","Distrito Capital","Falcón","Guárico","Lara","Mérida","Miranda","Monagas","Nueva Esparta","Portuguesa","Sucre","Táchira","Trujillo","Vargas","Yaracuy","Zulia"];

    // Cargar estados en el select
    const selectE = document.getElementById('selectEstado');
    estadosVzla.forEach(e => {
        let opt = document.createElement('option');
        opt.value = e;
        opt.innerHTML = e;
        selectE.appendChild(opt);
    });

    // Función principal: Cargar datos de la tabla
    async function cargarDatos() {
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            let sumaMonto = 0;

            // Ordenar por fecha (más reciente arriba)
            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                sumaMonto += parseFloat(v.monto || 0);
                const status = (v.logistica || 'procesado').toLowerCase();

                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(v.fecha).toLocaleDateString()}</td>
                        <td>${v.nombre}</td>
                        <td>${v.producto}</td>
                        <td>$${parseFloat(v.monto).toFixed(2)}</td>
                        <td>
                            <button class="btn-status status-${status}" onclick="cambiarEstatus('${v.rowId}', this)">
                                ${status}
                            </button>
                        </td>
                        <td><button class="btn-doc" onclick="alert('Ver detalle de ${v.nombre}')">DOC</button></td>
                    </tr>
                `;
            });

            document.getElementById('total-monto').innerText = `$${sumaMonto.toFixed(2)}`;
            document.getElementById('total-pedidos').innerText = data.length;

        } catch (error) {
            console.error('Error al cargar datos:', error);
        }
    }

    // Función para actualizar el botón y el Excel
    async function cambiarEstatus(rowId, btn) {
        const estados = ['procesado', 'enviado', 'entregado'];
        let actual = btn.innerText.trim().toLowerCase();
        let siguiente = estados[(estados.indexOf(actual) + 1) % estados.length];

        btn.disabled = true;
        btn.innerText = "Cargando...";

        const params = new URLSearchParams();
        params.append('rowId', rowId);
        params.append('logistica', siguiente);

        try {
            // Enviamos la actualización al Apps Script
            await fetch(scriptURL, {
                method: 'POST',
                body: params,
                mode: 'no-cors'
            });

            // Actualizamos la interfaz sin recargar toda la tabla
            btn.innerText = siguiente;
            btn.className = `btn-status status-${siguiente}`;
        } catch (e) {
            alert("Error al conectar con Google Sheets");
            btn.innerText = actual;
        } finally {
            btn.disabled = false;
        }
    }

    // Manejar el envío del formulario
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "REGISTRANDO...";
        btn.disabled = true;

        const formData = new URLSearchParams(new FormData(e.target));

        try {
            await fetch(scriptURL, { 
                method: 'POST', 
                body: formData, 
                mode: 'no-cors' 
            });
            e.target.reset();
            alert("¡Registro exitoso!");
            cargarDatos(); // Recargar tabla
        } catch (error) {
            alert("Error al enviar el registro.");
        } finally {
            btn.innerText = "Registrar Venta";
            btn.disabled = false;
        }
    });

    // Cargar al iniciar la página
    window.onload = cargarDatos;
</script>

</body>
</html>
