<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>THE SPOT - Sistema Integral</title>
    <style>
        :root { --dark: #000; --white: #fff; --gray: #f4f4f4; }
        body { font-family: sans-serif; background: var(--gray); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: var(--white); padding: 20px; border: 3px solid var(--dark); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.8rem; }
        th { background: var(--dark); color: var(--white); padding: 10px; text-align: left; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        .btn-status { border: none; padding: 5px; color: white; font-weight: bold; cursor: pointer; width: 90px; text-transform: uppercase; font-size: 0.6rem; }
        .status-procesado { background: #666; }
        .status-enviado { background: #f39c12; }
        .status-entregado { background: #27ae60; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #000; box-sizing: border-box; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button#btnGuardar { grid-column: span 2; background: var(--dark); color: var(--white); padding: 15px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; text-transform:uppercase;">The Spot</h1>
    
    <form id="registroForm" class="form-grid">
        <input type="text" name="nombre" placeholder="NOMBRE CLIENTE" required>
        <input type="text" name="cedula" placeholder="CÉDULA" required>
        <input type="text" name="telefono" placeholder="TELÉFONO" required>
        <select name="estado" id="selectEstado"></select>
        <input type="text" name="agencia" placeholder="COD. AGENCIA" required>
        <input type="text" name="producto" placeholder="PRODUCTO" required>
        <input type="number" step="0.01" name="monto" placeholder="MONTO TOTAL ($)" style="grid-column: span 2;" required>
        <button type="submit" id="btnGuardar">REGISTRAR VENTA</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Logística</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr><td colspan="4" style="text-align:center;">Cargando historial...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQWjggPSP6ZOkkFTvljn3QmWwKj4wbQ-iigliSxIyDFUoh3L9QPDHx56FNxHNbVFn9/exec';
    
    // Llenar estados
    const estados = ["Amazonas","Anzoátegui","Apure","Aragua","Barinas","Bolívar","Carabobo","Cojedes","Delta Amacuro","Distrito Capital","Falcón","Guárico","Lara","Mérida","Miranda","Monagas","Nueva Esparta","Portuguesa","Sucre","Táchira","Trujillo","Vargas","Yaracuy","Zulia"];
    estados.forEach(e => document.getElementById('selectEstado').innerHTML += `<option value="${e}">${e}</option>`);

    async function cargarDatos() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';

            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                const st = (v.logistica || 'procesado').toLowerCase();
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(v.fecha).toLocaleDateString()}</td>
                        <td>${v.nombre}</td>
                        <td>$${v.monto}</td>
                        <td>
                            <button class="btn-status status-${st}" onclick="cambiar('${v.rowId}', this)">
                                ${st}
                            </button>
                        </td>
                    </tr>`;
            });
        } catch (e) { 
            document.getElementById('cuerpoTabla').innerHTML = '<tr><td colspan="4">Error al conectar. Verifica la implementación.</td></tr>';
        }
    }

    async function cambiar(id, btn) {
        const ops = ['procesado', 'enviado', 'entregado'];
        let next = ops[(ops.indexOf(btn.innerText.toLowerCase()) + 1) % ops.length];
        btn.disabled = true;
        btn.innerText = "...";
        
        await fetch(`${scriptURL}?rowId=${id}&logistica=${next}`, { method: 'POST' });
        btn.disabled = false;
        btn.innerText = next;
        btn.className = `btn-status status-${next}`;
    }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "PROCESANDO...";
        await fetch(scriptURL, { method: 'POST', body: new URLSearchParams(new FormData(e.target)) });
        e.target.reset();
        btn.innerText = "REGISTRAR VENTA";
        cargarDatos();
    });

    window.onload = cargarDatos;
</script>
</body>
</html>
