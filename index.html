<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SPOT - Sistema Integral</title>
    <style>
        :root {
            --dark: #000;
            --white: #fff;
            --gray: #f4f4f4;
            --status-p: #7f8c8d;
            --status-e: #f39c12;
            --status-d: #27ae60;
        }

        body { font-family: 'Inter', Arial, sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 950px; margin: auto; background: var(--white); padding: 30px; border: 4px solid var(--dark); box-shadow: 12px 12px 0px var(--dark); }
        
        header { text-align: center; border-bottom: 5px solid var(--dark); margin-bottom: 30px; padding-bottom: 10px; }
        header h1 { font-size: 3.5rem; margin: 0; letter-spacing: -3px; text-transform: uppercase; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 40px; }
        input, select { padding: 12px; border: 2px solid var(--dark); font-weight: bold; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        .full { grid-column: span 2; }
        
        button#btnGuardar { 
            grid-column: span 2; background: var(--dark); color: var(--white); 
            padding: 18px; border: none; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; font-size: 1rem;
        }

        .table-wrap { overflow-x: auto; border: 2px solid var(--dark); }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        thead th { background: var(--dark); color: var(--white); padding: 12px; text-align: left; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #ddd; }

        .btn-status { border: none; padding: 6px 10px; color: white; font-weight: 900; text-transform: uppercase; font-size: 0.6rem; cursor: pointer; width: 95px; }
        .status-procesado { background-color: var(--status-p); }
        .status-enviado { background-color: var(--status-e); color: #000; }
        .status-entregado { background-color: var(--status-d); }
        
        .btn-doc { background: none; border: 1px solid var(--dark); cursor: pointer; font-weight: bold; font-size: 0.65rem; padding: 5px 8px; }

        /* MODAL FACTURA */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .invoice-box { width: 90%; max-width: 400px; padding: 30px; border: 2px solid var(--dark); background: white; position: relative; }
        .no-print { display: flex; gap: 10px; margin-top: 20px; }

        @media print { .no-print { display: none; } body { padding: 0; } .container { border: none; box-shadow: none; } }
    </style>
</head>
<body>

<div class="container">
    <header><h1>THE SPOT</h1></header>

    <form id="registroForm" class="form-grid">
        <input type="text" name="nombre" placeholder="NOMBRE CLIENTE" required>
        <input type="text" name="cedula" placeholder="CÉDULA" required>
        <input type="text" name="telefono" placeholder="TELÉFONO" required>
        <select name="estado" id="selectEstado" required></select>
        <input type="text" name="agencia" placeholder="AGENCIA (COD)" required>
        <input type="text" name="producto" placeholder="PRODUCTO" required>
        <input type="number" step="0.01" name="monto" placeholder="MONTO TOTAL ($)" class="full" required>
        <button type="submit" id="btnGuardar">REGISTRAR VENTA</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Monto</th>
                    <th>Logística</th>
                    <th>Factura</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<div id="modalFactura" class="modal">
    <div class="invoice-box">
        <h2 style="margin:0; text-transform: uppercase; border-bottom: 3px solid #000;">The Spot</h2>
        <div id="invoice-content" style="font-size: 0.9rem; line-height: 1.5; margin-top: 15px;"></div>
        <div class="no-print">
            <button onclick="window.print()" style="flex:1; padding:10px; background:#000; color:#fff; cursor:pointer; font-weight:bold;">IMPRIMIR</button>
            <button onclick="cerrarFactura()" style="flex:1; padding:10px; background:#ddd; border:none; cursor:pointer;">CERRAR</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQWjggPSP6ZOkkFTvljn3QmWwKj4wbQ-iigliSxIyDFUoh3L9QPDHx56FNxHNbVFn9/exec';
    
    const estados = ["Amazonas","Anzoátegui","Apure","Aragua","Barinas","Bolívar","Carabobo","Cojedes","Delta Amacuro","Distrito Capital","Falcón","Guárico","Lara","Mérida","Miranda","Monagas","Nueva Esparta","Portuguesa","Sucre","Táchira","Trujillo","Vargas","Yaracuy","Zulia"];
    estados.forEach(e => document.getElementById('selectEstado').innerHTML += `<option value="${e}">${e}</option>`);

    async function cargar() {
        try {
            const res = await fetch(scriptURL);
            const data = await res.json();
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';

            data.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(v => {
                const log = (v.logistica || 'procesado').toLowerCase();
                const filaData = JSON.stringify(v).replace(/'/g, "&apos;");
                
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(v.fecha).toLocaleDateString()}</td>
                        <td><strong>${v.nombre}</strong></td>
                        <td>$${parseFloat(v.monto).toFixed(2)}</td>
                        <td><button class="btn-status status-${log}" onclick="cambiarStatus('${v.rowId}', this)">${log}</button></td>
                        <td><button class="btn-doc" onclick='verFactura(${filaData})'>DOC</button></td>
                    </tr>`;
            });
        } catch (e) { console.error(e); }
    }

    async function cambiarStatus(rowId, btn) {
        const flow = ['procesado', 'enviado', 'entregado'];
        let next = flow[(flow.indexOf(btn.innerText.trim().toLowerCase()) + 1) % flow.length];
        btn.disabled = true; btn.innerText = "...";
        await fetch(`${scriptURL}?rowId=${rowId}&logistica=${next}`, { method: 'POST' });
        btn.disabled = false; btn.innerText = next; btn.className = `btn-status status-${next}`;
    }

    function verFactura(d) {
        document.getElementById('invoice-content').innerHTML = `
            <p><b>FECHA:</b> ${new Date(d.fecha).toLocaleString()}</p>
            <p><b>CLIENTE:</b> ${d.nombre}</p>
            <p><b>CÉDULA:</b> ${d.cedula}</p>
            <p><b>TELÉFONO:</b> ${d.telefono}</p>
            <p><b>UBICACIÓN:</b> ${d.estado} - Agencia ${d.agencia}</p>
            <p><b>PRODUCTO:</b> ${d.producto}</p>
            <h3 style="text-align:right; border-top: 1px solid #000; padding-top:10px; margin-top:20px;">TOTAL: $${parseFloat(d.monto).toFixed(2)}</h3>
        `;
        document.getElementById('modalFactura').style.display = 'flex';
    }

    function cerrarFactura() { document.getElementById('modalFactura').style.display = 'none'; }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.innerText = "PROCESANDO...";
        await fetch(scriptURL, { method: 'POST', body: new URLSearchParams(new FormData(e.target)) });
        e.target.reset(); btn.innerText = "REGISTRAR VENTA";
        cargar();
    });

    window.onload = cargar;
</script>
</body>
</html>
